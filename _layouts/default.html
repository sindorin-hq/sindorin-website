<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
{% include head.html %}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {%- for script in page.scripts %}
  <script src="{{ script | relative_url }}" defer></script>
  {%- endfor %}
</body>
</html>
